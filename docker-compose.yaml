# Portable deployment for Quality Matrix.
#
# Works out of the box on a fresh Docker server: data is baked into the backend
# image from hackathon-backend/data and both services pick safe defaults.
#
# Optional runtime overrides (secrets, NYRA, proxies) live in .env.production:
#   cp .env.example .env.production   # then edit values
#
# If you are outside the Intel network, skip the internal-only nyra-services
# package at build time by setting NYRA_INDEX_URL to an empty value:
#   NYRA_INDEX_URL= docker compose up -d --build

services:
  hackathon-frontend:
    build:
      context: ./hackathon-frontend
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        FTP_PROXY: ${FTP_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        ftp_proxy: ${ftp_proxy:-}
        no_proxy: ${no_proxy:-}
    env_file:
      - path: .env.production
        required: false
    container_name: hackathon-frontend
    image: hackathon-frontend:latest
    ports:
      - "8005:8005"
    environment:
      NODE_ENV: production
      PORT: 8005
      DJANGO_BASE_URL: http://hackathon-backend:8004
      VITE_ENCRYPTION_KEY: ${VITE_ENCRYPTION_KEY:-}
      ALLOWED_ORIGINS: http://localhost:8005
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      FTP_PROXY: ${FTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      ftp_proxy: ${ftp_proxy:-}
      no_proxy: ${no_proxy:-}
    depends_on:
      - hackathon-backend
    restart: always

  hackathon-backend:
    build:
      context: ./hackathon-backend
      dockerfile: Dockerfile
      args:
        NYRA_INDEX_URL: ${NYRA_INDEX_URL-https://devpi.intel.com/general/nyra/+simple/}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        FTP_PROXY: ${FTP_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        ftp_proxy: ${ftp_proxy:-}
        no_proxy: ${no_proxy:-}
    env_file:
      - path: .env.production
        required: false
    container_name: hackathon-backend
    image: hackathon-backend:latest
    ports:
      - "8004:8004"
    environment:
      QUALITY_MATRIX_DATA_DIR: /app/data
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      FTP_PROXY: ${FTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      ftp_proxy: ${ftp_proxy:-}
      no_proxy: ${no_proxy:-}
    # Data is baked into the image from hackathon-backend/data, so a fresh
    # deploy works with no external share. Intel production only: uncomment to
    # override the baked-in data with the network share.
    # volumes:
    #   - /mnt/x/Quality:/app/data
    restart: always

