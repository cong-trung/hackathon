# Portable deployment for Quality Matrix.
#
# Both services pick safe defaults. Production mounts the NetApp share through the `quality_data` CIFS volume. It
# needs QUALITY_SHARE_USERNAME and QUALITY_SHARE_PASSWORD in .env.production, and
# optionally QUALITY_SHARE_DOMAIN and QUALITY_SHARE_SMB_VERSION.
# Always run: docker compose --env-file .env.production ...
#
# Optional runtime overrides (secrets, NYRA, proxies) live in .env.production:
#   cp .env.example .env.production   # then edit values
#
# If you are outside the Intel network, skip the internal-only nyra-services
# package at build time by setting NYRA_PACKAGE_URL to an empty value:
#   NYRA_PACKAGE_URL= docker compose up -d --build

services:
  hackathon-frontend:
    build:
      context: ./hackathon-frontend
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        FTP_PROXY: ${FTP_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        ftp_proxy: ${ftp_proxy:-}
        no_proxy: ${no_proxy:-}
    env_file:
      - path: .env.production
        required: false
    container_name: hackathon-frontend
    image: hackathon-frontend:latest
    ports:
      - "8005:8005"
    environment:
      NODE_ENV: production
      PORT: 8005
      DJANGO_BASE_URL: http://hackathon-backend:8004
      VITE_ENCRYPTION_KEY: ${VITE_ENCRYPTION_KEY:-}
      # Set true once the site is served over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${FRONTEND_ALLOWED_ORIGINS:-http://quality-matrix-vnat.intel.com,http://localhost:8005}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      FTP_PROXY: ${FTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      ftp_proxy: ${ftp_proxy:-}
      no_proxy: ${no_proxy:-}
    depends_on:
      - hackathon-backend
    restart: always

  hackathon-backend:
    build:
      context: ./hackathon-backend
      dockerfile: Dockerfile
      args:
        NYRA_PACKAGE_URL: ${NYRA_PACKAGE_URL-git+https://mfg-github.mfg.intel.com/intel-manufacturing/applications.manufacturing.intel.common.imi.api.nyra.nyra-services.git@main}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        FTP_PROXY: ${FTP_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        ftp_proxy: ${ftp_proxy:-}
        no_proxy: ${no_proxy:-}
    env_file:
      - path: .env.production
        required: false
    container_name: hackathon-backend
    image: hackathon-backend:latest
    ports:
      - "8004:8004"
    environment:
      QUALITY_MATRIX_DATA_DIR: /app/data
      QUALITY_MATRIX_PUBLIC_URL: ${QUALITY_MATRIX_PUBLIC_URL:-http://quality-matrix-vnat.intel.com}
      QUALITY_MATRIX_SMTP_HOST: ${QUALITY_MATRIX_SMTP_HOST:-SMTP.intel.com}
      QUALITY_MATRIX_SMTP_PORT: ${QUALITY_MATRIX_SMTP_PORT:-25}
      QUALITY_MATRIX_MAIL_FROM: ${QUALITY_MATRIX_MAIL_FROM:-ba-chu-YP-va-em-Minh-dep-trai@intel.com}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      FTP_PROXY: ${FTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      ftp_proxy: ${ftp_proxy:-}
      no_proxy: ${no_proxy:-}
    # NetApp share (CIFS volume defined below), mounted at /app/data.
    volumes:
      - quality_data:/app/data
    restart: always

  # celery-beat:
  #   build: .
  #   command: celery -A backend beat --loglevel=info
  #   volumes:
  #     - .:/code
  #   depends_on:
  #     - redis
  #     - hackathon-backend

volumes:
  quality_data:
    driver: local
    driver_opts:
      type: cifs
      device: "//VNATSHFS.intel.com/VNATAnalysis$$/MAOATM/VN/Applications/TE/Quality"
      o: "addr=VNATSHFS.intel.com,username=${QUALITY_SHARE_USERNAME:?set QUALITY_SHARE_USERNAME in .env.production},password=${QUALITY_SHARE_PASSWORD:?set QUALITY_SHARE_PASSWORD in .env.production},domain=${QUALITY_SHARE_DOMAIN:-},vers=${QUALITY_SHARE_SMB_VERSION:-3.0},uid=0,gid=0,file_mode=0664,dir_mode=0775"
